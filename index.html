<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="急診報馬仔提供全台 59 間重度級急救責任醫院的即時急診量能數據，每 15 分鐘全自動更新。包含等待住院、看診、推床及加護病房人數，幫助您掌握醫療量能，找床位免走冤枉路。">
    <meta name="keywords" content="急診室即時訊息, 急診滿床, 醫院等床, 衛福部急診數據, 醫療分流, 急診報馬仔">
    <title>急診報馬仔：全台醫院塞車雷達</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🐸</text></svg>">
    <style>
        body {
            background-color: #0f172a; 
            color: #e2e8f0;
        }
        .pulse-red { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="font-sans p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row md:justify-between md:items-end border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold tracking-wider text-white">🚑 急診報馬仔 <span class="text-slate-400 text-xl">| 🐸全台醫院塞車雷達 </span></h1>
                <p class="text-slate-400 mt-2 text-sm">即時掌握重度級醫院量能，找床位請找羅廷瑋</p>
            </div>
            <div class="mt-4 md:mt-0 flex flex-wrap gap-3 items-center">
                <!-- 🐸 Ko-fi 贊助按鈕（綠色 dot 在裡面）-->
                <a href="https://ko-fi.com/croaktw" target="_blank" class="bg-[#FF5E5B] hover:bg-[#ff4a47] text-white font-bold text-sm px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 transition-transform hover:scale-105">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <span class="text-base animate-bounce">🐸</span>
                    <span>贊助伺服器費用</span>
                </a>
                <!-- 系統更新時間 -->
                <div class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg shadow-lg text-sm font-semibold text-slate-300 flex items-center gap-2">
                    系統更新時間：<span id="update-time" class="text-emerald-400 tracking-wider">載入中...</span>
                </div>
            </div>
        </header>

        <!-- 📊 全台醫院總計（永久顯示）-->
        <div class="mb-6 bg-gradient-to-r from-slate-800 to-slate-700 border border-slate-600 rounded-2xl p-6 shadow-2xl">
            <div class="flex items-center gap-3 mb-4">
                <span class="text-3xl">🏥</span>
                <h2 class="text-2xl font-bold text-white">全台急診即時統計</h2>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-600">
                    <div class="text-slate-400 text-xs uppercase tracking-wider mb-2">等待住院</div>
                    <div id="total-admit" class="text-3xl font-bold text-red-400">-</div>
                </div>
                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-600">
                    <div class="text-slate-400 text-xs uppercase tracking-wider mb-2">等待看診</div>
                    <div id="total-see" class="text-3xl font-bold text-yellow-400">-</div>
                </div>
                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-600">
                    <div class="text-slate-400 text-xs uppercase tracking-wider mb-2">等待推床</div>
                    <div id="total-push" class="text-3xl font-bold text-blue-400">-</div>
                </div>
                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-600">
                    <div class="text-slate-400 text-xs uppercase tracking-wider mb-2">加護病房</div>
                    <div id="total-icu" class="text-3xl font-bold text-purple-400">-</div>
                </div>
            </div>
        </div>

        <!-- 📢 緊急聯絡資訊（永久顯示）-->
        <div class="mb-6 text-sm text-red-300 bg-red-950/50 border border-red-900/60 rounded-xl px-4 py-3 flex items-center gap-2 shadow-inner">
            <span class="text-base">📢</span>
            <span>如有病床需求或緊急協助，請聯繫台中市立法委員羅廷瑋服務處：<strong class="text-white bg-red-600/40 px-2 py-0.5 rounded font-mono select-all">(04) 2260-2727</strong></span>
        </div>

        <!-- 🗺️ 地圖/列表切換按鈕 -->
        <div class="flex gap-4 mb-6">
            <button id="btn-list-view" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-semibold transition-all duration-300 flex items-center gap-2 shadow-lg">
                <span class="text-xl">📋</span>
                <span>列表檢視</span>
            </button>
            <button id="btn-map-view" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-semibold transition-all duration-300 flex items-center gap-2 shadow-lg">
                <span class="text-xl">🗺️</span>
                <span>地圖檢視</span>
            </button>
        </div>

        <!-- 🗺️ 地圖容器 -->
        <div id="map-container" class="hidden mb-8 rounded-xl overflow-hidden shadow-2xl border-2 border-slate-700" style="height: 600px;"></div>

        <div class="space-y-10" id="list-container">
            
        <section>
                <div class="flex flex-col gap-2 mb-4">
                    
                    <div class="flex items-center gap-3">
                        <span class="flex h-4 w-4 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.8)]"></span>
                        <h2 class="text-2xl font-bold text-red-400 tracking-wide">
                            最高警戒等級 (滿床或住院等待 > 50人)
                        </h2>
                    </div>
                </div>
                <div id="red-zone" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mt-4"></div>
            </section>

            <section>
                <div class="flex items-center gap-3 mb-4 mt-8 border-t border-slate-800 pt-8">
                    <span class="flex h-4 w-4 rounded-full bg-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.8)]"></span>
                    <h2 class="text-2xl font-bold text-yellow-400 tracking-wide">
                        二級警戒邊緣 (住院等待 20~50人)
                    </h2>
                </div>
                <div id="yellow-zone" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
            </section>

            <section>
                <div class="flex items-center gap-3 mb-4 mt-8 border-t border-slate-800 pt-8">
                    <span class="flex h-4 w-4 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></span>
                    <h2 class="text-2xl font-bold text-emerald-400 tracking-wide">
                        綠色安全通道 (正常運作)
                    </h2>
                </div>
                <div id="green-zone" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
            </section>

        </div>
    </div>
    <footer class="mt-8 mb-4 text-center text-xs text-slate-500 space-y-1">
        <div>後端數據全自動調度中 | Powered by 🐸🐸</div>
        <div>© 2026 急診報馬仔 | <span class="bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded font-mono text-[10px]">v1.0.0</span></div>
    </footer>
    <script>
        // 🗺️ 使用新的地圖視覺化資料分頁（含經緯度）
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR4_XMpW_axVYSQFaPtTK_OaXprwGlSGYJjBs5eGjNzjQY62TJXBByT62sVLLZh9f9Mk37RQiUl58js/pub?gid=1390068115&single=true&output=csv';
        
        let map = null;
        let hospitalData = [];

        function createCard(hospital) {
            const fullName = hospital['醫院全名'] || hospital['簡稱'];
            const address = hospital['地址'] || '';
            
            const waitAdmit = parseInt(hospital['住院']) || 0;
            const waitSee = parseInt(hospital['看診']) || 0;
            const waitPush = parseInt(hospital['推床']) || 0;
            const waitIcu = parseInt(hospital['加護病房']) || 0;
            const isFull = hospital['是否已向119通報滿床'] && hospital['是否已向119通報滿床'].includes('是');
            
            let status = 'green';
            if (isFull || waitAdmit >= 50) status = 'red';
            else if (waitAdmit >= 20) status = 'yellow';

            let borderClass = 'border-emerald-500/50';
            let bgClass = 'bg-slate-800/80';
            let nameColor = 'text-slate-200';
            let alertTag = '';

            if (status === 'red') {
                borderClass = 'border-red-500 pulse-red';
                bgClass = 'bg-slate-800 border border-red-900/50';
                nameColor = 'text-white';
                alertTag = isFull ? '<span class="bg-red-600 text-white text-[10px] px-2 py-1 rounded shadow-sm tracking-wider uppercase font-bold border border-red-400/30 whitespace-nowrap">通報滿床</span>' : '';
            } else if (status === 'yellow') {
                borderClass = 'border-yellow-500/70';
                bgClass = 'bg-slate-800 border border-yellow-900/30';
            } else {
                bgClass = 'bg-slate-800 border border-slate-700/50';
            }

            const innerBoxClass = "bg-slate-900/50 p-2 rounded flex flex-col justify-center items-center border border-slate-700/50";
            const labelClass = "text-slate-400 text-[10px] tracking-widest uppercase mb-1";
            const valueClass = "text-xl font-mono text-slate-300";

            const cardHTML = `
                <div class="border-l-[3px] ${borderClass} ${bgClass} rounded-r-xl shadow-lg hover:shadow-xl transition-all duration-300 p-4 flex flex-col justify-between group">
                    <div>
                        <div class="flex items-start justify-between mb-1">
                            <h3 class="text-lg font-bold ${nameColor} group-hover:text-white transition-colors leading-tight line-clamp-2">${fullName}</h3>
                            ${alertTag}
                        </div>
                        <p class="text-xs text-slate-400 mb-4 flex items-center gap-1 line-clamp-1" title="${address}">
                            <svg class="w-3 h-3 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.242-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            ${address}
                        </p>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div class="${innerBoxClass}">
                                <span class="${labelClass}">等待住院</span>
                                <span class="${valueClass} ${waitAdmit > 20 ? (status === 'red' ? 'text-red-400 font-bold' : 'text-yellow-400') : ''}">${waitAdmit}</span>
                            </div>
                            <div class="${innerBoxClass}">
                                <span class="${labelClass}">等待推床</span>
                                <span class="${valueClass}">${waitPush}</span>
                            </div>
                            <div class="${innerBoxClass}">
                                <span class="${labelClass}">等待看診</span>
                                <span class="${valueClass}">${waitSee}</span>
                            </div>
                            <div class="${innerBoxClass}">
                                <span class="${labelClass}">加護病房</span>
                                <span class="${valueClass}">${waitIcu}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            return { html: cardHTML, status: status, waitAdmit: waitAdmit };
        }

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                const redZone = document.getElementById('red-zone');
                const yellowZone = document.getElementById('yellow-zone');
                const greenZone = document.getElementById('green-zone');
                
                let lastUpdateTime = "等待訊號...";
                let cards = { red: [], yellow: [], green: [] };
                hospitalData = []; // 🗺️ 清空並重新收集醫院資料
                
                // 📊 初始化全台總計
                let totalAdmit = 0, totalSee = 0, totalPush = 0, totalIcu = 0;

                data.forEach(row => {
                    if (!row['簡稱']) return;
                    if (row['資料更新時間']) lastUpdateTime = row['資料更新時間'];
                    
                    const cardData = createCard(row);
                    cards[cardData.status].push(cardData);
                    
                    // 📊 累加總計
                    const waitAdmit = parseInt(row['住院']) || 0;
                    const waitSee = parseInt(row['看診']) || 0;
                    const waitPush = parseInt(row['推床']) || 0;
                    const waitIcu = parseInt(row['加護病房']) || 0;
                    
                    totalAdmit += waitAdmit;
                    totalSee += waitSee;
                    totalPush += waitPush;
                    totalIcu += waitIcu;
                    
                    // 🗺️ 收集帶有經緯度的醫院資料
                    const lat = parseFloat(row['緯度']);
                    const lng = parseFloat(row['經度']);
                    if (lat && lng) {
                        hospitalData.push({
                            name: row['醫院全名'] || row['簡稱'],
                            shortName: row['簡稱'],
                            address: row['地址'],
                            lat: lat,
                            lng: lng,
                            waitAdmit: waitAdmit,
                            waitSee: waitSee,
                            waitPush: waitPush,
                            waitIcu: waitIcu,
                            isFull: row['是否已向119通報滿床']?.includes('是'),
                            status: cardData.status
                        });
                    }
                });

                // 📊 更新全台總計顯示
                document.getElementById('total-admit').innerText = totalAdmit;
                document.getElementById('total-see').innerText = totalSee;
                document.getElementById('total-push').innerText = totalPush;
                document.getElementById('total-icu').innerText = totalIcu;
                
                document.getElementById('update-time').innerText = lastUpdateTime;

                const sortByWait = (a, b) => b.waitAdmit - a.waitAdmit;
                cards.red.sort(sortByWait);
                cards.yellow.sort(sortByWait);
                cards.green.sort(sortByWait);

                redZone.innerHTML = cards.red.length ? cards.red.map(c => c.html).join('') : '<p class="text-slate-500 col-span-full italic">目前無醫院達此警戒標準</p>';
                yellowZone.innerHTML = cards.yellow.length ? cards.yellow.map(c => c.html).join('') : '<p class="text-slate-500 col-span-full italic">目前無醫院達此警戒標準</p>';
                greenZone.innerHTML = cards.green.length ? cards.green.map(c => c.html).join('') : '<p class="text-slate-500 col-span-full italic">目前無資料</p>';
                
                // 🗺️ 初始化地圖（僅在第一次載入時）
                if (hospitalData.length > 0) {
                    initMap();
                }
            }
        });
        
        // 🗺️ 地圖初始化函數
        function initMap() {
            if (!map) {
                map = L.map('map-container').setView([23.7, 120.9], 7);
                // 🌙 使用深色地圖主題（CartoDB Dark Matter）
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '© OpenStreetMap contributors © CARTO',
                    maxZoom: 19
                }).addTo(map);
            }
            renderMapMarkers();
        }
        
        // 🗺️ 渲染地圖標記
        function renderMapMarkers() {
            if (!map) return;
            
            // 清除現有標記
            map.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    map.removeLayer(layer);
                }
            });
            
            // 加入醫院標記
            hospitalData.forEach(h => {
                const color = h.status === 'red' ? '#ef4444' :
                              h.status === 'yellow' ? '#eab308' : '#10b981';
                const size = h.status === 'red' ? 24 : h.status === 'yellow' ? 20 : 16;
                
                const icon = L.divIcon({
                    html: `<div style="background:${color}; width:${size}px; height:${size}px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(0,0,0,0.5);${h.status === 'red' ? 'animation: pulse 2s infinite;' : ''}"></div>`,
                    iconSize: [size, size],
                    className: ''
                });
                
                const marker = L.marker([h.lat, h.lng], { icon: icon }).addTo(map);
                
                // 點擊顯示詳細資訊
                marker.bindPopup(`
                    <div class="text-slate-900" style="min-width: 250px;">
                        <h3 class="font-bold text-lg mb-2 text-slate-800">${h.name}</h3>
                        <p class="text-sm text-slate-600 mb-3 border-b pb-2">${h.address}</p>
                        <div class="grid grid-cols-2 gap-2 text-sm">
                            <div class="bg-slate-50 p-2 rounded">
                                <span class="font-semibold text-slate-700">等待住院：</span>
                                <span class="text-lg font-bold ${h.waitAdmit >= 50 ? 'text-red-600' : h.waitAdmit >= 20 ? 'text-yellow-600' : 'text-emerald-600'}">${h.waitAdmit}</span>
                            </div>
                            <div class="bg-slate-50 p-2 rounded">
                                <span class="font-semibold text-slate-700">等待推床：</span>
                                <span class="text-lg font-bold text-slate-800">${h.waitPush}</span>
                            </div>
                            <div class="bg-slate-50 p-2 rounded">
                                <span class="font-semibold text-slate-700">等待看診：</span>
                                <span class="text-lg font-bold text-slate-800">${h.waitSee}</span>
                            </div>
                            <div class="bg-slate-50 p-2 rounded">
                                <span class="font-semibold text-slate-700">加護病房：</span>
                                <span class="text-lg font-bold text-slate-800">${h.waitIcu}</span>
                            </div>
                        </div>
                        ${h.isFull ? '<div class="mt-3"><span class="bg-red-600 text-white text-xs px-3 py-1 rounded-full font-bold">⚠️ 通報滿床</span></div>' : ''}
                    </div>
                `, {
                    maxWidth: 300
                });
            });
        }
        
        // 🗺️ 切換到列表檢視
        document.getElementById('btn-list-view').addEventListener('click', () => {
            document.getElementById('map-container').classList.add('hidden');
            document.getElementById('list-container').classList.remove('hidden');
            document.getElementById('btn-list-view').classList.add('bg-slate-700');
            document.getElementById('btn-list-view').classList.remove('bg-slate-600');
            document.getElementById('btn-map-view').classList.remove('bg-blue-700');
            document.getElementById('btn-map-view').classList.add('bg-blue-600');
        });
        
        // 🗺️ 切換到地圖檢視
        document.getElementById('btn-map-view').addEventListener('click', () => {
            document.getElementById('map-container').classList.remove('hidden');
            document.getElementById('list-container').classList.add('hidden');
            document.getElementById('btn-list-view').classList.remove('bg-slate-700');
            document.getElementById('btn-list-view').classList.add('bg-slate-600');
            document.getElementById('btn-map-view').classList.add('bg-blue-700');
            document.getElementById('btn-map-view').classList.remove('bg-blue-600');
            
            // 確保地圖正確顯示
            if (map) {
                setTimeout(() => map.invalidateSize(), 100);
            }
        });
    </script>
</body>
</html>
